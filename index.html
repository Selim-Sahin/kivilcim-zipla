<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#efe3c6">
  <meta name="description" content="Kıvılcım: bahçede platformdan platforma zıplayan küçük robot.">
  <title>Kıvılcım — Bahçe Zıplaması</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <!-- Three.js sabit sürüm: kodda "three" ve "three/addons/..." bu adreslere çözülür -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game" aria-label="Oyun alanı"></canvas>

  <div id="hud">
    <div id="score">0</div>
    <div id="best">En iyi: 0</div>
  </div>

  <div id="hint">
    Basılı tut, bırak, zıpla!
    <small>Fare, dokunma ya da Boşluk tuşu</small>
  </div>

  <div id="popups"></div>

  <div id="gameover">
    <div class="go-card">
      <div class="go-title">Oyun bitti</div>
      <div id="go-score" class="go-score">0</div>
      <div id="go-best" class="go-best">En iyi: 0</div>
      <div id="go-new" class="go-new" hidden>Yeni rekor!</div>
      <div class="go-hint">Tekrar oynamak için dokun</div>
    </div>
  </div>

  <div id="error" hidden>
    Bu tarayıcıda WebGL çalışmıyor. Güncel bir tarayıcıyla tekrar dene.
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
